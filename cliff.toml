# Changelog generation with git-cliff (https://git-cliff.org), from the commit messages.
# Commits follow "<type>: <description>" with full-word types (feature, fix, refactor, ...).
#   Update CHANGELOG.md:   npx git-cliff@2.10.0 --tag v1.2.3 -o CHANGELOG.md   (build/release.ps1 does this)
#   Notes of one release:  npx git-cliff@2.10.0 --latest --strip header

[changelog]
header = """
# Changelog

All notable changes to Label Editor. Generated from the commit history by [git-cliff](https://git-cliff.org).\n
"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {{ commit.message | split(pat="\n") | first | split(pat=": ") | slice(start=1) | join(sep=": ") | trim | upper_first }}\
{% endfor %}
{% endfor %}\n
"""
footer = ""
trim = true

[git]
conventional_commits = false
filter_unconventional = false
split_commits = false
commit_parsers = [
    { message = "^chore: release", skip = true },
    { message = "^feature:", group = "<!-- 0 -->Features" },
    { message = "^fix:", group = "<!-- 1 -->Fixes" },
    { message = "^hotfix:", group = "<!-- 1 -->Fixes" },
    { message = "^refactor:", group = "<!-- 2 -->Changes" },
    { message = "^docs:", group = "<!-- 3 -->Documentation" },
    { message = "^test:", group = "<!-- 4 -->Tests" },
    { message = "^chore:", group = "<!-- 5 -->Maintenance" },
    { message = "^(wip|experiment):", skip = true },
    { message = ".*", group = "<!-- 6 -->Other" },
]
protect_breaking_commits = false
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+"
sort_commits = "oldest"
