name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Tests that need Biesse's own LEdit files are skipped here: they are not part of the repository.
      - name: Test
        run: dotnet test LabelEditor.sln -c Release
